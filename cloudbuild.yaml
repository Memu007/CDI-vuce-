# ========================================================================
# Cloud Build - CI/CD Automático para CDI Sistema MARÍA
# ========================================================================
# Este archivo configura el deployment automático cuando haces git push
#
# Uso:
#   gcloud builds submit --config=cloudbuild.yaml
#
# O automático con Cloud Build Triggers:
#   gcloud builds triggers create github \
#     --repo-name=CDI \
#     --repo-owner=Memu007 \
#     --branch-pattern="^main$" \
#     --build-config=cloudbuild.yaml
# ========================================================================

steps:
  # Step 1: Build Docker image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "gcr.io/$PROJECT_ID/cdi-backend:$COMMIT_SHA"
      - "-t"
      - "gcr.io/$PROJECT_ID/cdi-backend:latest"
      - "."
    timeout: 600s

  # Step 2: Push to Container Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/$PROJECT_ID/cdi-backend:$COMMIT_SHA"

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/$PROJECT_ID/cdi-backend:latest"

  # Step 3: Deploy to Cloud Run (optimizado para 2000+ usuarios)
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "cdi-backend"
      - "--image"
      - "gcr.io/$PROJECT_ID/cdi-backend:$COMMIT_SHA"
      - "--region"
      - "us-central1"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      - "--memory"
      - "2Gi"
      - "--cpu"
      - "2"
      - "--max-instances"
      - "5"
      - "--min-instances"
      - "1"
      - "--concurrency"
      - "80"
      - "--timeout"
      - "120s"
      - "--set-secrets"
      - "GEMINI_API_KEY=gemini-api-key:latest,DATABASE_URL=database-url:latest,JWT_SECRET_KEY=jwt-secret-key:latest"
      # ALLOWED_ORIGINS es obligatoria: sin ella la app aborta el arranque en
      # producción (usa cookies, no puede aceptar "*"). Se pasa como
      # substitución para no hardcodear el dominio acá.
      # Separador ";" (delimitador "^;^") porque puede llevar varias URLs.
      - "--set-env-vars"
      - "^;^ENVIRONMENT=production;ENABLE_HSTS=true;EMAIL_VERIFICATION_REQUIRED=false;ALLOWED_ORIGINS=${_ALLOWED_ORIGINS}"

# Images to store in Container Registry
images:
  - "gcr.io/$PROJECT_ID/cdi-backend:$COMMIT_SHA"
  - "gcr.io/$PROJECT_ID/cdi-backend:latest"

# Build timeout
timeout: 1200s

# Opciones de build
options:
  machineType: "N1_HIGHCPU_8"
  logging: CLOUD_LOGGING_ONLY

# Substituciones (variables que se pasan al build)
#
# GEMINI_API_KEY, DATABASE_URL y JWT_SECRET_KEY NO van acá: se inyectan desde
# Secret Manager con --set-secrets (ver Step 3).
#
# _ALLOWED_ORIGINS sí va acá porque es un dominio público, no un secreto.
# Hay que pasarlo en cada build:
#   gcloud builds submit --config=cloudbuild.yaml \
#     --substitutions=_ALLOWED_ORIGINS=https://cdi.tu-dominio.com
# Si queda vacío, la app aborta el arranque con un error explícito (usa
# cookies y CORS no puede ser "*").
substitutions:
  _ALLOWED_ORIGINS: ""
