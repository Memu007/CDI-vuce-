name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencias del sistema
        run: sudo apt-get update && sudo apt-get install -y libmagic1

      - name: Dependencias Python
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Sintaxis Python
        run: python -m compileall -q proyecto_maria tests

      # La suite entera. Hasta 2026-07-26 no se podia correr: se colgaba para
      # siempre en los tests de billing/trial, asi que CI miraba solo 9
      # archivos elegidos a mano y el resto no lo revisaba nadie.
      #
      # Los 10 que quedan en rojo son fallas viejas que estaban tapadas por el
      # cuelgue; se deseleccionan de a una, con su motivo, para que el resto
      # este protegido desde ya. Sacar de esta lista a medida que se arreglen.
      - name: Suite completa
        env:
          ENVIRONMENT: testing
          JWT_SECRET_KEY: ci-only-key-material-with-more-than-32-characters
          EMAIL_VERIFICATION_REQUIRED: "false"
        run: >-
          python -m pytest --no-cov
          --deselect tests/test_csrf.py::test_enforce_no_afecta_bearer_sin_cookie
          --deselect tests/test_pdf_avg_functional.py::TestAutoNCMButtonRemoval::test_auto_ncm_button_not_in_html
          --deselect tests/test_recent_changes_validation.py::TestAutoNCMButtonRemovalValidation::test_no_auto_ncm_button_in_main_html
          --deselect tests/test_recent_changes_validation.py::TestAutoNCMButtonRemovalValidation::test_no_auto_ncm_functions_in_javascript
          --deselect tests/test_pilar_b_quotes.py::test_share_quote_valid
          --deselect tests/test_pilar_b_quotes.py::test_get_public_quote_valid
          --deselect tests/test_pilar_b_quotes.py::test_get_public_quote_expired
          --deselect tests/test_pilar_b_quotes.py::test_get_public_quote_rate_limit
          --deselect tests/test_pilar_b_quotes.py::test_share_quote_tarifar_returns_reordered_items
          --deselect tests/test_pilar_b_quotes.py::test_share_quote_tarifar_fails_returns_503

  e2e-maria:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: config/package-lock.json

      - name: Caché de Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('config/package-lock.json') }}

      - name: Dependencias del sistema
        run: sudo apt-get update && sudo apt-get install -y libmagic1 libnss3 libgbm1 libxss1

      - name: Dependencias Python
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Dependencias del E2E
        run: npm ci --prefix config

      - name: E2E MARIA aislado
        env:
          E2E_ARTIFACTS: ${{ runner.temp }}/cdi-e2e-maria-artifacts
        run: ./scripts/testing/e2e_maria.sh

      - name: Evidencia de fallo E2E
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-maria-failure
          path: ${{ runner.temp }}/cdi-e2e-maria-artifacts
          if-no-files-found: ignore
